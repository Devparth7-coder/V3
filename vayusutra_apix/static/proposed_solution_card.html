<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposed Solution Showcase | VayuSutra APIx</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #040814;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            width: 100%;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(13, 20, 38, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            padding: 14px 20px;
            backdrop-filter: blur(16px);
        }
        .img-card {
            width: 100%;
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(56, 189, 248, 0.15);
            overflow: hidden;
            display: block;
        }
        .img-card img {
            width: 100%;
            height: auto;
            display: block;
        }
        .btn-download {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #ffffff;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <div>
            <h1 style="font-size: 18px; font-weight: 800; color: #ffffff;">Proposed Solution Executive Visual Slide</h1>

        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <a href="/" style="color: #38bdf8; text-decoration: none; font-size: 12px; font-weight: 600; padding: 6px 12px; border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 6px;">
                &larr; Live Prototype Dashboard
            </a>
        </div>
    </div>

    <div class="img-card">
        <img src="/static/img/proposed_solution_executive_visual.png" alt="Proposed Solution Executive Visual Design">

</div>
