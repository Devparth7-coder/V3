apiVersion: v1
kind: Service
metadata:
  name: vayusutra-service
  namespace: vayusutra-system
  labels:
    app: vayusutra-apix
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: vayusutra-apix
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vayusutra-ingress
  namespace: vayusutra-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "vayusutra-service"
spec:
  tls:
    - hosts:
        - vayusutra.mospi.gov.in
      secretName: vayusutra-tls-cert
  rules:
    - host: vayusutra.mospi.gov.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vayusutra-service
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vayusutra-hpa
  namespace: vayusutra-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vayusutra-apix
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
