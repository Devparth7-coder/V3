apiVersion: apps/v1
kind: Deployment
metadata:
  name: vayusutra-apix
  namespace: vayusutra-system
  labels:
    app: vayusutra-apix
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: vayusutra-apix
  template:
    metadata:
      labels:
        app: vayusutra-apix
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: apix-service
          image: vayusutra/apix:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: vayusutra-config
            - secretRef:
                name: vayusutra-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: storage
              mountPath: /app/vayusutra_apix/data
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: vayusutra-data-pvc
