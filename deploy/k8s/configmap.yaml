apiVersion: v1
kind: ConfigMap
metadata:
  name: vayusutra-config
  namespace: vayusutra-system
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  PORT: "8000"
  WORKERS_COUNT: "4"
  CORS_ORIGINS: "*"
  INGESTION_WORKER_ENABLED: "true"
  INGESTION_INTERVAL_SECONDS: "60"
  PROMETHEUS_METRICS_ENABLED: "true"
  ENABLE_LIVE_WEBSOCKET: "true"
