name: VayuSutra APIx - CD Deployment Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Multi-Arch Docker Image & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: vayusutra/apix:latest,vayusutra/apix:${{ github.ref_name }}

      - name: Run Smoke Test on Container
        run: |
          docker build -t vayusutra-smoke .
          docker run -d --name smoke-test -p 8000:8000 vayusutra-smoke
          sleep 5
          docker exec smoke-test curl -f http://127.0.0.1:8000/api/v1/health || exit 1
          docker stop smoke-test
