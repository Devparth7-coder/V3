name: VayuSutra APIx - CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test Suite & Econometric Mathematical Rigor
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Execute Full Test Matrix
        run: |
          pytest -v --tb=short

      - name: Verify CLI Functionality
        run: |
          python -m vayusutra_apix.cli --help
          python -m vayusutra_apix.cli auth
          python -m vayusutra_apix.cli data-quality
